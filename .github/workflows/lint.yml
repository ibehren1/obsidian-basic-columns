name: Node.js build

on:
    push:
        branches: ['**']
    pull_request:
        branches: ['**']

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [20.x, 22.x, 24.x]
                # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'
            - name: Check every commit bumps the version
              run: |
                  if [ "${{ github.event_name }}" = "pull_request" ]; then
                    node scripts/check-version-bumps.mjs "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
                  else
                    node scripts/check-version-bumps.mjs "${{ github.event.before }}" "${{ github.sha }}"
                  fi
            - run: npm ci
            - run: npm run build --if-present
            - run: npm run lint
            - run: npm test
